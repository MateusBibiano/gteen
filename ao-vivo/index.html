<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solução da Equipe GTEeN · ao vivo</title>
<style>
/* Palco 16:9 fixo (1280x720) que escala para caber no slide.
   Esquerda: câmera com pontos + botões. Direita: painel do professor como no dia a dia. */
:root{
  --bg:#04070d; --stage:#0a111d; --card:#111b2c; --card2:#162338; --line:#21314a; --ink:#e9f1fb; --sub:#9fb2cd; --muted:#687b98;
  --azul:#3aa8f5; --azul2:#1469be; --ok:#3fd08a; --alerta:#f5c043; --laranja:#f08a3c; --urgente:#ff5a5f; --acolher:#f07ab4; --roxo:#a68bff;
  --s-eng:#4a90f0; --s-att:#1aa58f; --s-ten:#d96f2c;
  --f:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 var(--f);overflow:hidden}
#fit{position:fixed;inset:0;overflow:hidden}
#palco{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:var(--stage);display:grid;grid-template-rows:52px 1fr;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:0 18px;background:linear-gradient(90deg,#0f2d52,#0a111d 75%);border-bottom:1px solid var(--line)}
.top img{width:38px;height:38px;border-radius:9px}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .sp{flex:1}
.pill{font:600 12px var(--mono);padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.live{background:rgba(255,90,95,.16);color:#ff9b9e;display:flex;gap:7px;align-items:center}
.pill.live i{width:8px;height:8px;border-radius:50%;background:var(--urgente);animation:pisca 1.2s infinite}
@keyframes pisca{50%{opacity:.25}}
.auto{font:600 12px var(--f);border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:9px;padding:7px 11px;cursor:pointer}
.auto[aria-pressed="true"]{background:var(--azul2);color:#fff;border-color:var(--azul2)}
button:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.meio{display:grid;grid-template-columns:812px 1fr;gap:14px;padding:12px 16px 14px;min-height:0}
.esq{display:flex;flex-direction:column;gap:10px;min-height:0}
.cam{position:relative;width:812px;height:457px;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--line)}
.cam canvas{width:100%;height:100%;display:block}
.ctrl{display:grid;grid-template-columns:1fr;gap:5px}
.ctrl .t{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.row{display:flex;gap:6px;flex-wrap:nowrap;margin-bottom:5px}
.row button{font:600 13px var(--f);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:1 1 auto;transition:background .15s,border-color .15s,transform .08s}
.row button:hover{background:var(--card2)}
.row button:active{transform:scale(.96)}
.row button[aria-pressed="true"]{background:#123a63;border-color:var(--azul)}
.row button .e{font-size:16px;line-height:1}
.row button i{width:9px;height:9px;border-radius:3px}

/* painel */
.panel{display:flex;flex-direction:column;gap:9px;min-height:0;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;min-width:0}
.lbl{font:600 9.5px var(--mono);letter-spacing:.1em;color:var(--sub);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd{display:flex;gap:11px;align-items:center;height:44px}
.cd .sq{width:42px;height:42px;border-radius:12px;background:var(--ok);flex:none;transition:background .3s}
.cd>div:last-child{min-width:0;flex:1}
.cd .v{font-size:18px;font-weight:800;letter-spacing:.01em}
.cd .s{font:11px var(--mono);color:var(--sub)}
.bar{height:6px;border-radius:6px;background:#0a1322;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--ok);transition:width .15s linear}
.cdcard .bar{margin-top:9px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 9px;height:50px;min-width:0;transition:border-color .3s}
.mini .lbl{display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--azul)}
.mini .v{font-weight:700;font-size:13px;margin-top:4px}
.mini.flash{border-color:var(--azul)}
.probs{display:grid;gap:4px;margin-top:6px}
.prob{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;font:11px var(--mono);height:13px;white-space:nowrap}
.prob span:last-child{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.chartcard{flex:1;display:flex;flex-direction:column;gap:5px;min-height:0}
.leg{display:flex;gap:10px;font-size:10.5px;color:var(--sub);align-items:center}
.leg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle}
.leg .sp{flex:1}
canvas#chart{width:100%;flex:1;min-height:0;display:block}
.evs{display:grid;gap:3px;font-size:11.5px;height:54px;overflow:hidden;align-content:start}
.evs div{display:grid;grid-template-columns:40px 8px 1fr;gap:7px;align-items:center;white-space:nowrap;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(-4px)}}
.evs time{font:10.5px var(--mono);color:var(--muted)}
.evs i{width:7px;height:7px;border-radius:50%}
.evs span{overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// ---------------- mão: 21 pontos no estilo do MediaPipe ----------------
function pontosMao(punho, dir, dedos, esq){
  // dir: vetor unitário do antebraço (para onde os dedos apontam); perp para o lado
  const s = esq ? -1 : 1;
  const px = -dir.y*s, py = dir.x*s;
  const P = (u,v) => pt(punho.x + dir.x*u + px*v, punho.y + dir.y*u + py*v);
  const out = [P(0,0)];
  // polegar
  const tUp = dedos[0];
  out.push(P(14,-18), P(26 + tUp*4, -34 - tUp*6), tUp ? P(40,-48) : P(34,-24), tUp ? P(54,-60) : P(40,-14));
  const bases = [[-17,62],[-5,66],[7,63],[18,57]];   // v, u da base dos dedos
  const comp = [[26,18,15],[29,20,16],[26,18,15],[20,14,12]];
  bases.forEach(([v,u],i) => {
    const up = dedos[i+1], c = comp[i];

// ---------------- rosto: malha de pontos ----------------
function pontosRosto(f, cx, cy, t){
  const rx = 92, ry = 116*(1 - f.h*0.12), yaw = Math.sin(t*0.6)*0.03, rol = Math.sin(t*0.45)*0.025;
  const pts = {mesh:[], contorno:[], olhoE:[], olhoD:[], sobE:[], sobD:[], nariz:[], labioExt:[], labioInt:[], iris:[]};
  const M = (x,y) => { const X = x + yaw*(1 - x*x)*0.6, Y = y + f.h*0.1; const xr = X*Math.cos(rol) - Y*Math.sin(rol), yr = X*Math.sin(rol) + Y*Math.cos(rol); return pt(cx + xr*rx, cy + yr*ry); };
  for (let i=0;i<40;i++){ const a = i/40*Math.PI*2; pts.contorno.push(M(Math.cos(a)*0.98, Math.sin(a)*0.98)); }
  // malha interna (dá a aparência de face mesh)
  for (const [r,n] of [[0.86,34],[0.72,28],[0.56,22],[0.38,14]]) for (let i=0;i<n;i++){ const a = i/n*Math.PI*2 + r; const x = Math.cos(a)*r, y = Math.sin(a)*r*1.02; if (Math.abs(y-0.3)<0.12 && Math.abs(x)<0.3) continue; if (Math.abs(y+0.12)<0.09 && Math.abs(Math.abs(x)-0.38)<0.2) continue; pts.mesh.push(M(x,y)); }
  const piscada = (t % 3.7) < 0.12 ? 0.1 : 1, eo = 0.075*f.e*piscada;
  for (const [lado, arr] of [[-1, pts.olhoE],[1, pts.olhoD]]){
    for (let i=0;i<14;i++){ const a = i/14*Math.PI*2; arr.push(M(lado*0.38 + Math.cos(a)*0.17, -0.12 + Math.sin(a)*eo)); }
    pts.iris.push(M(lado*0.38, -0.12 + f.h*0.03));
  }
  for (const [lado, arr] of [[-1, pts.sobE],[1, pts.sobD]]) for (let i=0;i<6;i++){ const u = i/5; const x = lado*(0.14 + u*0.38); const y = -0.36 - f.b*0.09 - (1-u)*f.a*0.08 + u*f.a*0.03 + (f.a<0 ? (1-u)*(-f.a)*0.06 : 0) - Math.sin(u*Math.PI)*0.04; arr.push(M(x,y)); }
  for (let i=0;i<6;i++) pts.nariz.push(M(0, -0.18 + i*0.07));
  pts.nariz.push(M(-0.1,0.2), M(0.1,0.2));
  const larg = 0.33 + f.s*0.06 + f.o*0.03, cyM = 0.48, canto = -f.s*0.11, topo = -0.02 - f.o*0.03, base = 0.04 + f.o*0.32 + Math.max(0,f.s)*0.08;
  for (let i=0;i<=10;i++){ const u = i/10, x = -larg + 2*larg*u, k = Math.sin(u*Math.PI); pts.labioExt.push(M(x, cyM + canto*(1-k) + topo*k - 0.03*k)); }
  for (let i=9;i>=1;i--){ const u = i/10, x = -larg + 2*larg*u, k = Math.sin(u*Math.PI); pts.labioExt.push(M(x, cyM + canto*(1-k) + base*k + 0.03*k)); }
  for (let i=0;i<=8;i++){ const u = i/8, x = -larg*0.8 + 1.6*larg*u, k = Math.sin(u*Math.PI); pts.labioInt.push(M(x, cyM + canto*(1-k)*0.9 + topo*k)); }
  for (let i=7;i>=1;i--){ const u = i/8, x = -larg*0.8 + 1.6*larg*u, k = Math.sin(u*Math.PI); pts.labioInt.push(M(x, cyM + canto*(1-k)*0.9 + base*k*0.85)); }
  return pts;
}

// ---------------- lógica (mesma regra do sistema real, simplificada) ----------------
const LIM = {ABERTA:0.5, V:0.8, ESCOLHER:0.5, BAIXA:3, EMO:4, COMB:2};
const cont = {ABERTA:0, V:0, ESCOLHER:0, BAIXA:0, EMO:0, COMB:0};
const est = {cand:"calma", desde:0, conf:"calma", ult:-9};
let condutaAtual = "MANTER", infoAtual = {conduta:"MANTER", escolha:""}, cooldownAte = 0;
const PRIOR = {"OFERECER AJUDA":7,"OFERECER PAUSA":6,"ABRIR OPÇÕES":5,"ACOLHER":4,"VERIFICAR CANSAÇO":3,"OBSERVAR":2,"REFORÇAR":1,"MANTER":0};
function probs(f){
  const d = CLASSES.map(c => { const q = PROTO[c]; return (f.s-q.s)**2 + (f.o-q.o)**2 + (f.b-q.b)**2 + (f.a-q.a)**2 + (f.e-q.e)**2 + (Math.random()-0.5)*0.05; });
  const ex = d.map(v => Math.exp(-v/0.4)), s = ex.reduce((a,b)=>a+b,0); return ex.map(v => v/s);
}
function conduta(g, baixa, emo){
  if (cont.ABERTA >= LIM.ABERTA) return {conduta:"OFERECER AJUDA", s:"INTERVIR | imediato", cor:"#ff5a5f", ch:"ABERTA"};
  if (cont.V >= LIM.V) return {conduta:"OFERECER PAUSA", s:"INTERVIR | imediato", cor:"#f08a3c", ch:"V"};
  if (cont.ESCOLHER >= LIM.ESCOLHER) return {conduta:"ABRIR OPÇÕES", s:"APOIAR | agora", cor:"#f5c043", ch:"ESCOLHER"};
  if (cont.COMB >= LIM.COMB) return {conduta:"ACOLHER", s:"ACOLHER | breve", cor:"#f07ab4", ch:"COMB"};
  if (cont.BAIXA >= LIM.BAIXA) return {conduta:"VERIFICAR CANSAÇO", s:"OBSERVAR | acompanhar", cor:"#5b8def", ch:"BAIXA"};
  if (cont.EMO >= LIM.EMO) return {conduta:"OBSERVAR", s:"OBSERVAR | sem pressa", cor:"#a68bff", ch:"EMO"};
  if (g === "POLEGAR") return {conduta:"MANTER", s:"ESTÁVEL | aluno sinalizou bem", cor:"#3fd08a", ch:null};
  if (emo === "alegria" && !baixa) return {conduta:"REFORÇAR", s:"ESTÁVEL | participação positiva", cor:"#3fd08a", ch:null};
  return {conduta:"MANTER", s:"ESTÁVEL | contínuo", cor:"#3fd08a", ch:null};
}
const EV = {"OFERECER AJUDA":["Pedido de ajuda","#ff5a5f"],"OFERECER PAUSA":["Pedido de pausa","#f08a3c"],"ACOLHER":["Sinal combinado: acolher","#f07ab4"],"VERIFICAR CANSAÇO":["Cabeça baixa prolongada","#5b8def"],"OBSERVAR":["Emoção de atenção sustentada","#a68bff"]};
const eventos = [];
const mmss = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function evento(txt, cor){
  eventos.unshift({t:tS(), txt, cor}); if (eventos.length > 30) eventos.pop();
  $("evs").innerHTML = eventos.slice(0,3).map(e => `<div><time>${mmss(e.t)}</time><i style="background:${e.cor}"></i><span>${e.txt}</span></div>`).join("");
}
function flash(id){ const el = $(id); el.classList.add("flash"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("flash"), 600); }
const setT = (id, v) => { const el = $(id); if (el.textContent !== v){ el.textContent = v; return true; } return false; };

// série para o gráfico
const serie = []; let acc = {n:0, eng:0, att:0, ten:0, emo:{}}, ultAmostra = 0;
let fps = 30, fpsN = 0, fpsT = 0, ultEsc = "", escDesde = 0, escReg = false, gAnterior = null;

let tAnt = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.1, (now - tAnt)/1000); tAnt = now;
  const t = tS();
  fpsN++; if (t - fpsT > 1){ fps = Math.round(fpsN/(t-fpsT)); if (fps > 31) fps = 30; fpsT = t; fpsN = 0; }
  if (auto) passoAuto(t);
  if (gesto && t > gestoAte){ gesto = null; marcarGesto(); }

  // rosto
  const k = 1 - Math.pow(0.002, dt);
  alvoF.h = gesto === "BAIXA" ? 1 : 0;
  for (const key of ["s","o","b","a","e","h"]) F[key] += (alvoF[key] - F[key]) * k;

  // braços
  const alvoB = BRACOS[gesto] || BRACOS.null;
  let alvoPD = alvoB.punhoD;
  if (gesto === "ESCOLHER" && infoAtual.conduta === "ABRIR OPÇÕES"){
    // depois que as opções aparecem, o dedo desce até "ÁGUA"
    alvoPD = pt(840, 480);
  }
  const ka = 1 - Math.pow(0.004, dt);
  for (const key of ["cotoD","cotoE","punhoE"]) { ARM[key].x = lerp(ARM[key].x, alvoB[key].x, ka); ARM[key].y = lerp(ARM[key].y, alvoB[key].y, ka); }
  ARM.punhoD.x = lerp(ARM.punhoD.x, alvoPD.x, ka); ARM.punhoD.y = lerp(ARM.punhoD.y, alvoPD.y, ka);
  if (gesto === "ESCOLHER" && infoAtual.conduta === "ABRIR OPÇÕES"){ ARM.cotoD.x = lerp(ARM.cotoD.x, 950, ka); ARM.cotoD.y = lerp(ARM.cotoD.y, 360, ka); }
  const dAlvo = DEDOS_POR_GESTO[gesto] || [0,0,0,0,0];
  for (let i=0;i<5;i++){ dedosD[i] += ((dAlvo[i]) - dedosD[i]) * Math.min(1, dt*10); dedosE[i] += ((gesto === "DOIS" ? 1 : 0) - dedosE[i]) * Math.min(1, dt*10); }
  maoVisD += (((gesto && !["BAIXA"].includes(gesto)) ? 1 : 0) - maoVisD) * Math.min(1, dt*3.5);
  maoVisE += ((gesto === "DOIS" ? 1 : 0) - maoVisE) * Math.min(1, dt*3.5);

  // emoção
  const pr = probs(F); let im = 0; pr.forEach((v,i) => { if (v > pr[im]) im = i; });
  const cand = pr[im] < 0.58 ? "calma" : CLASSES[im];
  if (cand !== est.cand){ est.cand = cand; est.desde = t; }
  const precisa = est.cand === "calma" ? 0.8 : 1.4;
  if (est.cand !== est.conf && t - est.desde >= precisa && (est.cand === "calma" || t - est.ult >= 2.2)){ est.conf = est.cand; est.ult = t; flash("mEmo"); }

  // gestos efetivos (mão visível)
  const gEf = maoVisD > 0.8 ? ({ABERTA:"ABERTA", V:"V", POLEGAR:"POLEGAR", ESCOLHER:"ESCOLHER"})[gesto] || null : null;
  const baixa = F.h > 0.6, atencaoEmo = ["tristeza","medo","raiva"].includes(est.conf);
  const ativos = {ABERTA: gEf==="ABERTA", V: gEf==="V", ESCOLHER: gEf==="ESCOLHER", BAIXA: baixa, EMO: atencaoEmo, COMB: baixa && atencaoEmo};
  for (const c in cont) cont[c] = ativos[c] ? Math.min(cont[c] + dt, LIM[c]) : Math.max(0, cont[c] - 2*dt);
  let info = conduta(gEf, baixa, est.conf);
  if (PRIOR[info.conduta] <= PRIOR[infoAtual.conduta] && t < cooldownAte && infoAtual.conduta !== info.conduta) info = infoAtual;
  else if (info.conduta !== infoAtual.conduta) cooldownAte = t + 2.5;
  // escolha apontada
  info.escolha = "";
  if (info.conduta === "ABRIR OPÇÕES" && ultimoFrame.dedoIndicador){
    const lb = (W-60)/4, p = ultimoFrame.dedoIndicador;
    OPCOES.forEach((op,i) => { const x = 30 + i*lb; if (p.x >= x && p.x <= x+lb-14 && p.y >= H-196 && p.y <= H-76) info.escolha = op; });
  }
  if (info.escolha !== ultEsc){ ultEsc = info.escolha; escDesde = t; escReg = false; }
  else if (info.escolha && !escReg && t - escDesde > 1){ escReg = true; evento(`Escolheu: ${info.escolha}`, "#f5c043"); }
  if (info.conduta !== condutaAtual){ condutaAtual = info.conduta; if (EV[info.conduta]) evento(...EV[info.conduta]); }
  if (gEf === "POLEGAR" && gAnterior !== "POLEGAR") evento("Sinalizou que está bem", "#3fd08a");
  gAnterior = gEf;
  infoAtual = info;

  // indicadores
  const P = Object.fromEntries(CLASSES.map((c,i) => [c, pr[i]]));
  const att = baixa ? 0 : (0.92 + Math.sin(t*0.7)*0.08);
  const val = clamp01(P.alegria + 0.5*P.surpresa + 0.6*P.calma), ten = clamp01(P.raiva + P.medo);
  const eng = clamp01(0.45*att + 0.30*val + 0.15*(baixa?0:1) + 0.10*(1-ten));
  acc.n++; acc.eng += eng; acc.att += att; acc.ten += ten; acc.emo[est.conf] = (acc.emo[est.conf]||0)+1;
  if (t - ultAmostra >= 0.5){
    ultAmostra = t;
    const emoM = Object.entries(acc.emo).sort((a,b)=>b[1]-a[1])[0]?.[0] || "calma";
    serie.push({t, eng: 100*acc.eng/acc.n, att: 100*acc.att/acc.n, ten: 100*acc.ten/acc.n, emo: emoM});
    while (serie.length && t - serie[0].t > 62) serie.shift();
    acc = {n:0, eng:0, att:0, ten:0, emo:{}};
    desenharGrafico(t);
  }

  desenharCamera(t, info);

  // painel
  $("cdSq").style.background = info.cor; $("cdBar").style.background = info.cor;
  $("cdBar").style.width = (info.ch ? Math.min(1, cont[info.ch]/LIM[info.ch]) * 100 : 100) + "%";
  if (setT("cdV", info.conduta)) {}
  setT("cdS", info.s);
  if (setT("emoV", NOME_P[est.conf])) $("emoDot").style.background = COR[est.conf];
  const ped = info.escolha ? "ESCOLHA" : ({ABERTA:"AJUDA", V:"PAUSA", POLEGAR:"OK", ESCOLHER:"ESCOLHA"})[gEf] || "NENHUM";
  if (setT("pedV", ped)) flash("mPed");
  const post = baixa ? "CABEÇA BAIXA" : gesto === "DOIS" && maoVisD > 0.8 ? "BRAÇOS ERGUIDOS" : (gesto === "BRACO" && maoVisD > 0.8) ? "BRAÇO ERGUIDO" : "NEUTRA";
  if (setT("posV", post)) flash("mPos");
  if (setT("attV", att > 0.5 ? "OLHANDO" : "DISPERSO")) flash("mAtt");
  setT("tenV", Math.round(ten*100) + "%");
  setT("blkV", (15 + Math.round(Math.sin(t*0.1)*2)) + "/min");
  if (!loop._u || now - loop._u > 70){ loop._u = now;
    CLASSES.forEach((c,i) => { $("pb_"+c).style.width = (pr[i]*100).toFixed(0)+"%"; $("pv_"+c).textContent = Math.round(pr[i]*100)+"%"; });
  }
  $("relogio").textContent = mmss(t);
}

// ---------------- gráfico ----------------
const chart = $("chart"), cc = chart.getContext("2d");
function desenharGrafico(t){
  const r = chart.getBoundingClientRect(), s = palco.getBoundingClientRect().width/1280 || 1, dpr = (window.devicePixelRatio||1);
  const Wc = chart.clientWidth, Hc = chart.clientHeight;
  if (chart.width !== Math.round(Wc*dpr*s)){ chart.width = Math.round(Wc*dpr*s); chart.height = Math.round(Hc*dpr*s); }
  cc.setTransform(dpr*s,0,0,dpr*s,0,0); cc.clearRect(0,0,Wc,Hc);
  const pl = 26, pr = 30, top = 14, faixa = 9, eixo = 14, base = Hc - eixo - faixa - 5;
  const x = tt => pl + (tt - (t-60))/60*(Wc-pl-pr), y = v => base - v/100*(base-top);
  cc.font = "10px ui-monospace,Menlo,Consolas,monospace"; cc.textAlign = "right"; cc.textBaseline = "middle";
  for (const v of [0,50,100]){ cc.strokeStyle = "#1c2a40"; cc.lineWidth = 1; cc.beginPath(); cc.moveTo(pl, Math.round(y(v))+.5); cc.lineTo(Wc-pr, Math.round(y(v))+.5); cc.stroke(); cc.fillStyle = "#687b98"; cc.fillText(v, pl-6, y(v)); }
  cc.textAlign = "center"; cc.textBaseline = "top";
  for (let k=0;k<=60;k+=20){ const tt = Math.floor((t-60+k)); if (tt >= 0) { cc.fillStyle = "#687b98"; cc.fillText(mmss(tt), x(tt), Hc - eixo + 2); } }
  // faixa de emoção
  for (let i=0;i<serie.length;i++){ const sa = serie[i], nx = i+1 < serie.length ? x(serie[i+1].t) : x(sa.t)+4; cc.fillStyle = COR[sa.emo]; cc.fillRect(x(sa.t), base+5, Math.max(1, nx - x(sa.t) + 0.5), faixa); }
  // linhas (média móvel)
  const fim = [];
  for (const [kk,cor] of [["eng","#4a90f0"],["att","#1aa58f"],["ten","#d96f2c"]]){
    cc.strokeStyle = cor; cc.lineWidth = 2.2; cc.lineJoin = "round"; cc.beginPath();
    serie.forEach((sa,i) => { const j0 = Math.max(0,i-4); let m = 0; for (let j=j0;j<=i;j++) m += serie[j][kk]; m /= (i-j0+1); const X = x(sa.t), Y = y(m); i ? cc.lineTo(X,Y) : cc.moveTo(X,Y); if (i === serie.length-1) fim.push([X,Y,m,cor]); });
    cc.stroke();
  }
  fim.sort((a,b)=>a[1]-b[1]); let ult = -99;
  cc.textAlign = "left"; cc.textBaseline = "middle"; cc.font = "700 10.5px ui-monospace,Menlo,Consolas,monospace";
  for (const [X,Y,m,cor] of fim){ cc.fillStyle = cor; cc.beginPath(); cc.arc(X,Y,3.5,0,Math.PI*2); cc.fill(); const ly = Math.max(Y, ult+11); ult = ly; cc.fillStyle = "#e9f1fb"; cc.fillText(Math.round(m), Wc-pr+6, ly); }
  // eventos no topo
  for (const e of eventos){ if (e.t < t-60) continue; cc.fillStyle = e.cor; cc.beginPath(); cc.arc(x(e.t), 5, 3.5, 0, Math.PI*2); cc.fill(); }
}

// ---------------- botões ----------------
function marcarEmo(){ document.querySelectorAll("#bEmo button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.emo === emoBtn))); }
function marcarGesto(){ document.querySelectorAll("#bGes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.g === gesto))); }
function setEmo(e){ emoBtn = e; Object.assign(alvoF, PROTO[e]); marcarEmo(); }
function setGesto(g){
  const t = tS();
  if (gesto === g) gesto = null; else { gesto = g; gestoInicio = t; gestoAte = t + (g === "BAIXA" ? 10 : g === "ESCOLHER" ? 7 : 5); }
  marcarGesto();
}
$("bEmo").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; pararAuto(); setEmo(b.dataset.emo); });
$("bGes").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; pararAuto(); setGesto(b.dataset.g); });

// ---------------- demonstração automática ----------------
const ROTEIRO = [[0,()=>{setEmo("calma"); gesto=null; marcarGesto();}],[3,()=>setEmo("alegria")],[7,()=>setGesto("ABERTA")],[13,()=>setEmo("calma")],[15,()=>setGesto("ESCOLHER")],[23,()=>setEmo("surpresa")],[26,()=>setEmo("calma")],[28,()=>setGesto("BRACO")],[33,()=>setEmo("tristeza")],[34,()=>setGesto("BAIXA")],[45,()=>{setGesto("BAIXA"); setEmo("calma");}],[47,()=>setGesto("V")],[53,()=>setGesto("POLEGAR")],[58,()=>setEmo("raiva")],[64,()=>setEmo("calma")],[66,()=>setGesto("DOIS")],[72,null]];
let auto = false, autoT0 = 0, autoI = 0;
function passoAuto(t){
  const tt = t - autoT0;
  while (autoI < ROTEIRO.length && tt >= ROTEIRO[autoI][0]){ const f = ROTEIRO[autoI][1]; if (f) f(); else { autoT0 = t; autoI = -1; } autoI++; }
}
function pararAuto(){ if (!auto) return; auto = false; $("btnAuto").setAttribute("aria-pressed","false"); $("btnAuto").textContent = "▶ Demonstração automática"; }
$("btnAuto").onclick = () => {
  if (auto) return pararAuto();
  auto = true; autoT0 = tS(); autoI = 0; $("btnAuto").setAttribute("aria-pressed","true"); $("btnAuto").textContent = "■ Parar demonstração";
};
if (location.hash === "#auto") $("btnAuto").click();

// histórico inicial para o gráfico não começar vazio
(() => { const t = 0; for (let i=120;i>0;i--){ const tt = -i*0.5; serie.push({t: tt, eng: 72 + Math.sin(i*0.21)*8 + (Math.random()-0.5)*6, att: 85 + Math.sin(i*0.13)*7 + (Math.random()-0.5)*6, ten: 12 + Math.sin(i*0.17)*5 + (Math.random()-0.5)*4, emo: i>70 && i<90 ? "alegria" : "calma"}); } })();
evento("Início da sessão · Aluno A01", "#687b98");
requestAnimationFrame(loop);
</script>
